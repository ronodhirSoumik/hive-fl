[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hive-fl"
version = "0.1.0"
description = "Plug-and-play federated learning platform - community-driven model training without sharing raw data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Soumik Sarker" }]
requires-python = ">=3.10"
keywords = ["federated-learning", "privacy", "machine-learning", "decentralized"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
docker = [
    "docker>=6.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
hive = "hive.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"